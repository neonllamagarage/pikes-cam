<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>Pike's 13 Smart Cam</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0b1329; color: #cbd5e1; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .flash-overlay { animation: camFlash 0.12s ease-out; }
    @keyframes camFlash { 0% { background: rgba(255,255,255,0.8); } 100% { background: transparent; } }
    .shutter-glow:active { transform: scale(0.90); }
  </style>
</head>
<body class="p-2 sm:p-4 min-h-screen flex flex-col justify-between">

  <div class="w-full max-w-lg mx-auto space-y-3">
    <!-- TOP HEADER -->
    <div class="flex items-center justify-between bg-slate-900/90 p-3 rounded-2xl border border-slate-800 shadow-xl">
      <h1 class="text-sm font-black text-white tracking-wider flex items-center gap-1.5">
        📸 PIKE'S 13 <span class="text-emerald-400">RAPID CAM</span>
      </h1>
      <span id="camStatus" class="text-xs font-mono font-bold text-emerald-400 animate-pulse">STREAMING</span>
    </div>

    <!-- INTAKE CONTROLS: CATEGORY, BIN, QTY -->
    <div class="bg-slate-900/80 p-3 rounded-2xl border border-slate-800 grid grid-cols-12 gap-2 shadow-lg">
      <div class="col-span-4">
        <label class="block text-[10px] font-black text-emerald-400 uppercase tracking-widest mb-1">Type</label>
        <select id="itemType" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-bold text-xs outline-none">
          <option value="Diecast" selected>🚗 Diecast</option>
          <option value="Clothing">👕 Clothing</option>
          <option value="Other">📦 Other</option>
        </select>
      </div>
      <div class="col-span-5">
        <label class="block text-[10px] font-black text-blue-400 uppercase tracking-widest mb-1">Bin / Location</label>
        <input type="text" id="binCode" placeholder="e.g. O-H3" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-emerald-400 font-mono font-black text-xs uppercase outline-none focus:border-blue-500">
      </div>
      <div class="col-span-3">
        <label class="block text-[10px] font-black text-slate-400 uppercase tracking-widest mb-1">Qty</label>
        <input type="number" id="itemQty" value="1" min="1" class="w-full p-2.5 bg-slate-950 border border-slate-700 rounded-xl text-white font-mono font-bold text-xs text-center outline-none">
      </div>
    </div>

    <!-- DIRECT WEBRTC STREAM VIEWFINDER -->
    <div class="relative w-full aspect-[4/3] bg-black rounded-2xl overflow-hidden border-2 border-slate-700 shadow-2xl flex items-center justify-center">
      <video id="liveVideo" autoplay playsinline muted class="w-full h-full object-cover"></video>
      <div id="flashScreen" class="absolute inset-0 pointer-events-none z-30"></div>
      <canvas id="frameCanvas" class="hidden"></canvas>

      <!-- CONTINUOUS IN-APP SHUTTER BUTTON -->
      <div class="absolute bottom-4 inset-x-0 flex items-center justify-center z-20">
        <button type="button" onclick="snapContinuous()" class="shutter-glow bg-emerald-500 hover:bg-emerald-400 border-4 border-white w-20 h-20 rounded-full flex items-center justify-center shadow-2xl transition">
          <div class="w-14 h-14 rounded-full border-2 border-black/20 bg-emerald-600 flex items-center justify-center">
            <span class="text-white text-xl">📸</span>
          </div>
        </button>
      </div>

      <!-- SHOT COUNTER BADGE -->
      <div class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur px-3 py-1 rounded-full border border-slate-700 text-xs font-mono font-bold text-white z-20">
        Shots: <span id="shotCount" class="text-emerald-400 font-black text-sm">0</span> / 12
      </div>
    </div>

    <!-- REAL-TIME THUMBNAIL STRIP -->
    <div class="bg-slate-900/80 p-2.5 rounded-xl border border-slate-800 flex items-center gap-2 overflow-x-auto min-h-[64px]" id="thumbStrip">
      <span class="text-xs text-slate-500 italic px-2" id="emptyNotice">Tap shutter to capture shots in real time.</span>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex gap-2">
      <button type="button" onclick="clearShots()" class="px-4 py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-xl text-xs border border-slate-700 transition">
        Clear
      </button>
      <button type="button" onclick="stageToLister()" id="btnStage" class="flex-grow bg-blue-600 hover:bg-blue-500 text-white font-black py-3.5 rounded-xl text-sm shadow-xl flex items-center justify-center gap-2 border border-blue-400 transition active:scale-95">
        <span>🚀</span> <span id="stageLabel">STAGE FOR LISTER</span>
      </button>
    </div>
  </div>

  <script>
    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP /EXEC URL HERE:
    const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_WEBAPP_URL_HERE";

    let stagedPhotos = [];
    let videoStream = null;

    window.addEventListener('DOMContentLoaded', () => {
      startCamera();
      const savedBin = localStorage.getItem('pikes_bin');
      if (savedBin) document.getElementById('binCode').value = savedBin;
    });

    async function startCamera() {
      const video = document.getElementById('liveVideo');
      const status = document.getElementById('camStatus');
      try {
        if (videoStream) videoStream.getTracks().forEach(t => t.stop());
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
        video.srcObject = videoStream;
        status.innerText = "STREAMING";
        status.className = "text-xs font-mono font-bold text-emerald-400 animate-pulse";
      } catch (err) {
        status.innerText = "ERROR";
        status.className = "text-xs font-mono font-bold text-red-400";
        alert("Camera blocked. Please tap 'Allow' when the browser asks for camera access.");
      }
    }

    function snapContinuous() {
      if (stagedPhotos.length >= 12) return alert("Maximum 12 photos reached.");
      const video = document.getElementById('liveVideo');
      const canvas = document.getElementById('frameCanvas');
      if (!videoStream || video.videoWidth === 0) return alert("Camera not ready.");

      const flash = document.getElementById('flashScreen');
      flash.classList.add('flash-overlay');
      setTimeout(() => flash.classList.remove('flash-overlay'), 120);

      let max = 1280;
      let w = video.videoWidth, h = video.videoHeight;
      if (w > h && w > max) { h = Math.round(h * (max / w)); w = max; }
      else if (h > max) { w = Math.round(w * (max / h)); h = max; }

      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(video, 0, 0, w, h);

      const b64 = canvas.toDataURL('image/jpeg', 0.72);
      stagedPhotos.push(b64);
      renderThumbs();

      if (navigator.vibrate) navigator.vibrate(25);
    }

    function renderThumbs() {
      const strip = document.getElementById('thumbStrip');
      const countEl = document.getElementById('shotCount');
      countEl.innerText = stagedPhotos.length;

      if (stagedPhotos.length === 0) {
        strip.innerHTML = '<span class="text-xs text-slate-500 italic px-2">Tap shutter to capture shots in real time.</span>';
        return;
      }

      strip.innerHTML = '';
      stagedPhotos.forEach((b64, idx) => {
        strip.innerHTML += `
          <div class="relative flex-shrink-0 w-14 h-14 bg-slate-950 border border-slate-700 rounded-lg overflow-hidden">
            <img src="${b64}" class="w-full h-full object-cover">
            <span class="absolute top-0 left-0 bg-blue-600 text-white font-mono text-[9px] px-1 rounded-br font-bold">${idx + 1}</span>
            <button type="button" onclick="deleteShot(${idx})" class="absolute top-0 right-0 bg-red-600 text-white text-[10px] w-4 h-4 flex items-center justify-center rounded-bl font-black">✕</button>
          </div>`;
      });
      strip.scrollLeft = strip.scrollWidth;
    }

    function deleteShot(idx) {
      stagedPhotos.splice(idx, 1);
      renderThumbs();
    }

    function clearShots() {
      stagedPhotos = [];
      renderThumbs();
    }

    async function stageToLister() {
      if (stagedPhotos.length === 0) return alert("Take at least one photo.");
      const binVal = document.getElementById('binCode').value.trim();
      if (!binVal) {
        alert("Enter Bin / Location.");
        document.getElementById('binCode').focus();
        return;
      }

      localStorage.setItem('pikes_bin', binVal);

      const payload = {
        action: "stageIntake",
        bin: binVal,
        itemType: document.getElementById('itemType').value,
        qty: parseInt(document.getElementById('itemQty').value) || 1,
        imagesBase64: [...stagedPhotos]
      };

      // Optimistic UI reset
      clearShots();
      document.getElementById('itemQty').value = "1";

      const label = document.getElementById('stageLabel');
      label.innerText = "STAGED! READY FOR NEXT CAR";
      setTimeout(() => { label.innerText = "STAGE FOR LISTER"; }, 1500);

      try {
        await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify(payload)
        });
      } catch (err) {
        alert("Upload error: " + err.message);
      }
    }
  </script>
</body>
</html>
